name: Branch gates

on:
  pull_request:
    branches: [development, production]
  push:
    branches: [development, production]

jobs:
  production-pr-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'production'
    runs-on: ubuntu-latest
    steps:
      - name: Require development as PR source branch
        run: |
          if [ "${{ github.head_ref }}" != "development" ] || [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "Only same-repository development -> production pull requests are allowed."
            exit 1
          fi

  production-lineage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify production contains development history
        run: |
          git fetch origin development --depth=1
          git merge-base --is-ancestor origin/development HEAD || {
            echo "Production must be promoted from development."
            exit 1
          }

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
