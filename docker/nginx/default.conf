server {
  listen 80;
  server_name _;
  absolute_redirect off;
  resolver 127.0.0.11 ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' ${CSP_TURNSTILE_SRC}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ${CSP_CONNECT_SRC} ${CSP_TURNSTILE_SRC}; frame-src 'self' ${CSP_TURNSTILE_SRC}; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Public share URLs such as /abc123/file.png render the SPA preview by
  # default. Raw bytes are only proxied to rustypaste when the client asks for
  # them explicitly with ?raw=1 or ?download=true.
  location ~ ^/(?<paste_id>[^/?]+)/file(?:\.(?<paste_ext>.+))?$ {
    set $paste_file $paste_id;
    if ($paste_ext != "") {
      set $paste_file "${paste_id}.${paste_ext}";
    }
    if ($arg_raw) {
      return 418;
    }
    if ($arg_download) {
      return 418;
    }
    return 302 /#/preview?p=$uri;
  }

  error_page 418 = @paste_raw_file;

  location @paste_raw_file {
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass ${API_UPSTREAM}/$paste_file$is_args$args;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass ${API_UPSTREAM}/;
  }

  location /auth/ {
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass ${API_UPSTREAM}/auth/;
  }

  location /resolve/ {
    set $resolver_upstream http://resolver:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass $resolver_upstream/resolve/;
  }
}
