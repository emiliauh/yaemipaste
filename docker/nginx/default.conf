server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Public share URLs such as /abc123/file.png render the SPA preview by
  # default. Raw bytes are only proxied to rustypaste when the client asks for
  # them explicitly with ?raw=1 or ?download=true.
  location ~ ^/([^/?]+)/file(?:\.(.+))?$ {
    set $paste_file $1;
    if ($2 != "") {
      set $paste_file $1.$2;
    }
    if ($arg_raw) {
      return 418;
    }
    if ($arg_download) {
      return 418;
    }
    try_files $uri $uri/ /index.html;
  }

  error_page 418 = @paste_raw_file;

  location @paste_raw_file {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://paste-api:8000/$paste_file$is_args$args;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://paste-api:8000/;
  }

  location /auth/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://paste-api:8000/auth/;
  }
}
