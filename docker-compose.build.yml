services:
  paste-api:
    build:
      context: ./backend/nestjs

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PASTE_API: ${VITE_PASTE_API:-/api}
        VITE_AUTH_API: ${VITE_AUTH_API:-/auth}
        VITE_FILE_RESOLVE_BASE: ${VITE_FILE_RESOLVE_BASE:-/api/resolve}
        VITE_TOKEN_OWNER_PATH: ${VITE_TOKEN_OWNER_PATH:-/api/token-owner}
        VITE_PUBLIC_SITE_ORIGIN: ${VITE_PUBLIC_SITE_ORIGIN:-}
        VITE_HISTORY_WS: ${VITE_HISTORY_WS:-}
        VITE_PUBLIC_META_CACHE_BUST: ${VITE_PUBLIC_META_CACHE_BUST:-0}
        VITE_ENABLE_SHAREX: ${VITE_ENABLE_SHAREX:-1}
        VITE_ENABLE_AUTH: ${VITE_ENABLE_AUTH:-1}
        VITE_REPOSITORY_URL: ${VITE_REPOSITORY_URL:-https://github.com/emiliauh/yaemipaste}
        VITE_MAX_EXPIRY_DAYS: ${VITE_MAX_EXPIRY_DAYS:-14}
