<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yaemipaste · Server Error</title>
    <style>
      :root {
        --bg: #000;
        --bg1: #0d0d0d;
        --border: #2a2a2a;
        --text: #e8e8e8;
        --text2: #888;
        --accent: #2f7cf6;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.6 "JetBrains Mono", "Fira Code", "Consolas", monospace;
      }
      .card {
        width: min(560px, 100%);
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg1);
        padding: 18px;
      }
      h1 { font-size: 16px; margin-bottom: 8px; }
      p { color: var(--text2); margin-bottom: 10px; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 5px 12px;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--text);
        text-decoration: none;
      }
      a:hover { border-color: var(--accent); color: #fff; }
      .code { color: var(--accent); margin-bottom: 6px; font-size: 12px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">5xx · server error</div>
      <h1>The server had an issue handling that request.</h1>
      <p>Please retry in a moment. If this keeps happening, share the URL with the owner.</p>
      <a href="/#/files">Open dashboard</a>
    </main>
  </body>
</html>
