services:
  paste-api:
    image: ${PASTE_API_IMAGE:-orhunp/rustypaste:latest}
    restart: unless-stopped
    environment:
      DB_PATH: ${DB_PATH:-/var/lib/rustypaste-auth/users.db}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AUTH_ADMIN_BEARER: ${AUTH_ADMIN_BEARER:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      PASTE_API: ${PASTE_PUBLIC_API:-http://localhost:8080/api}
      PASSKEYS_ENABLED: ${PASSKEYS_ENABLED:-0}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-yaemipaste}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-}
      PASSKEY_ORIGINS: ${PASSKEY_ORIGINS:-}
    volumes:
      - yaemipaste-auth:/var/lib/rustypaste-auth
    networks:
      - yaemipaste

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PASTE_API: ${VITE_PASTE_API:-/api}
        VITE_AUTH_API: ${VITE_AUTH_API:-/auth}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_ENABLE_SHAREX: ${VITE_ENABLE_SHAREX:-0}
        VITE_REPOSITORY_URL: ${VITE_REPOSITORY_URL:-https://github.com/emiliauh/yaemipaste}
        VITE_MAX_EXPIRY_DAYS: ${VITE_MAX_EXPIRY_DAYS:-14}
    restart: unless-stopped
    depends_on:
      - paste-api
    ports:
      - "${UI_PORT:-8080}:80"
    networks:
      - yaemipaste

networks:
  yaemipaste:
    name: yaemipaste

volumes:
  yaemipaste-auth:
