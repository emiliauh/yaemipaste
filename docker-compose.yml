services:
  paste-api:
    profiles: ["api"]
    image: ${YAEMIPASTE_API_IMAGE:-ghcr.io/emiliauh/yaemipaste-api}:${YAEMIPASTE_IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      CONFIG: /etc/rustypaste/config.toml
      DB_PATH: ${DB_PATH:-/var/lib/rustypaste-auth/users.db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be a non-empty random secret}
      VITE_ENABLE_SHAREX: ${VITE_ENABLE_SHAREX:-1}
      AUTH_ADMIN_BEARER: ${AUTH_ADMIN_BEARER:?AUTH_ADMIN_BEARER must be a non-empty random secret}
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      PASTE_URL: ${PASTE_URL:-http://localhost:8080}
      PASTE_API: ${PASTE_PUBLIC_API:-http://localhost:8080/api}
      PASSKEYS_ENABLED: ${PASSKEYS_ENABLED:-0}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-yaemipaste}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-}
      PASSKEY_ORIGINS: ${PASSKEY_ORIGINS:-}
      PASSKEY_ALLOW_ANY_PORT: ${PASSKEY_ALLOW_ANY_PORT:-0}
      PASSKEY_ALLOW_SUBDOMAINS: ${PASSKEY_ALLOW_SUBDOMAINS:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      REMOTE_UPLOADS_ENABLED: ${REMOTE_UPLOADS_ENABLED:-1}
      ALLOW_ANONYMOUS_UPLOADS: ${ALLOW_ANONYMOUS_UPLOADS:-1}
      SERVER__URL: ${PASTE_URL:-http://localhost:8080}
      SERVER__ADDRESS: 0.0.0.0:8000
      SERVER__UPLOAD_PATH: /var/lib/rustypaste/upload
    volumes:
      - ./docker/rustypaste/config.toml:/etc/rustypaste/config.toml:ro
      - yaemipaste-upload:/var/lib/rustypaste/upload
      - yaemipaste-auth:/var/lib/rustypaste-auth
    networks:
      - yaemipaste
    ports:
      - "${API_PUBLISH_BIND:-127.0.0.1}:${API_PUBLISH_PORT:-8000}:8000"

  resolver:
    image: node:22-alpine
    restart: unless-stopped
    profiles:
      - with-resolver
    command: ["sh", "-lc", "apk add --no-cache sqlite >/dev/null && node /app/resolver-server/server.mjs"]
    working_dir: /app
    environment:
      RESOLVER_PORT: ${RESOLVER_PORT:-3101}
      RESOLVER_UPLOAD_DIR: /var/lib/rustypaste/upload
      RESOLVER_USERS_DB_PATH: ${DB_PATH:-/var/lib/rustypaste-auth/users.db}
      RESOLVER_PUBLIC_ORIGIN: ${RESOLVER_PUBLIC_ORIGIN:-http://localhost:8080}
      RESOLVER_CACHE_TTL_MS: ${RESOLVER_CACHE_TTL_MS:-30000}
    volumes:
      - ./resolver-server:/app/resolver-server:ro
      - yaemipaste-upload:/var/lib/rustypaste/upload:ro
      - yaemipaste-auth:/var/lib/rustypaste-auth:ro
    ports:
      - "127.0.0.1:${RESOLVER_PORT:-3101}:${RESOLVER_PORT:-3101}"
    networks:
      - yaemipaste

  ui:
    profiles: ["ui"]
    image: ${YAEMIPASTE_UI_IMAGE:-ghcr.io/emiliauh/yaemipaste-ui}:${YAEMIPASTE_IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      CSP_CONNECT_SRC: "${CSP_CONNECT_SRC:-}"
      CSP_TURNSTILE_SRC: "${CSP_TURNSTILE_SRC:-}"
      API_UPSTREAM: "${API_UPSTREAM:-http://paste-api:8000}"
    ports:
      - "${UI_BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-8080}:80"
    networks:
      - yaemipaste

networks:
  yaemipaste:
    name: yaemipaste

volumes:
  yaemipaste-upload:
  yaemipaste-auth:
