services:
  paste-api:
    image: ${PASTE_API_IMAGE:-ghcr.io/replace-me/rustypaste:latest}
    restart: unless-stopped
    environment:
      DB_PATH: ${DB_PATH:-/var/lib/rustypaste-auth/users.db}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ADMIN_BEARER: ${AUTH_ADMIN_BEARER:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      PASTE_API: ${PASTE_PUBLIC_API:-http://localhost:8080/api}
      PASSKEYS_ENABLED: ${PASSKEYS_ENABLED:-0}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-rustypaste-ui}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-}
      PASSKEY_ORIGINS: ${PASSKEY_ORIGINS:-}
    volumes:
      - rustypaste-ui-auth:/var/lib/rustypaste-auth
    networks:
      - rustypaste-ui

  resolver:
    image: node:22-alpine
    restart: unless-stopped
    profiles:
      - with-resolver
    command: ["node", "/app/resolver-server/server.mjs"]
    working_dir: /app
    environment:
      RESOLVER_PORT: ${RESOLVER_PORT:-3101}
      RESOLVER_UPLOAD_DIR: ${RESOLVER_UPLOAD_DIR:-/var/lib/rustypaste/upload}
      RESOLVER_PUBLIC_ORIGIN: ${RESOLVER_PUBLIC_ORIGIN:-http://localhost:8080}
      RESOLVER_CACHE_TTL_MS: ${RESOLVER_CACHE_TTL_MS:-30000}
    volumes:
      - ./:/app:ro
      - ${RESOLVER_UPLOAD_DIR:-/var/lib/rustypaste/upload}:${RESOLVER_UPLOAD_DIR:-/var/lib/rustypaste/upload}:ro
    ports:
      - "127.0.0.1:${RESOLVER_PORT:-3101}:${RESOLVER_PORT:-3101}"
    networks:
      - rustypaste-ui

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PASTE_API: ${VITE_PASTE_API:-/api}
        VITE_AUTH_API: ${VITE_AUTH_API:-/auth}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
        VITE_ENABLE_SHAREX: ${VITE_ENABLE_SHAREX:-0}
        VITE_ENABLE_AUTH: ${VITE_ENABLE_AUTH:-1}
        VITE_REPOSITORY_URL: ${VITE_REPOSITORY_URL:-https://github.com/emiliauh/rustypaste-ui}
        VITE_MAX_EXPIRY_DAYS: ${VITE_MAX_EXPIRY_DAYS:-14}
    restart: unless-stopped
    depends_on:
      - paste-api
    ports:
      - "${UI_PORT:-8080}:80"
    networks:
      - rustypaste-ui

networks:
  rustypaste-ui:
    name: rustypaste-ui

volumes:
  rustypaste-ui-auth:
